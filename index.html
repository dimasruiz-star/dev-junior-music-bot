<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Julieth ❤️</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 320px; }
        h2 { color: #1db954; margin-bottom: 5px; }
        p { color: #b3b3b3; font-size: 14px; }
        audio { width: 100%; margin-top: 20px; outline: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Sin Reproducción</h2>
        <p id="artist">Esperando orden de Discord...</p>
        <audio id="player" controls autoplay></audio>
    </div>

    <script>
        const socket = io(); // Conecta automáticamente al mismo servidor Render
        const player = document.getElementById('player');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');

        socket.on('new_song', (data) => {
            console.log("Nueva canción recibida:", data);
            titleEl.textContent = data.title;
            artistEl.textContent = data.artist;
            if (data.url) {
                player.src = data.url;
                player.play().catch(err => console.log("Permiso de audio requerido por el navegador:", err));
            }
        });

        socket.on('control_action', (data) => {
            if (data.action === 'pause') player.pause();
            if (data.action === 'resume') player.play();
            if (data.action === 'stop') { player.pause(); player.currentTime = 0; }
        });
    </script>
</body>
</html>
